name: CI

# 为什么有这个文件：本仓此前**没有任何 CI**（见 docs/plans/2026-09-13-typed-unit-dirs.md §1③），
# `scripts/verify-all.sh` 再全，也得靠人记得在提交前手动敲。结果就是「改名改了 ~1100 处，
# 却在 npm 包 README、官网 meta、CLI --help 里漏了 12 处旧术语」这类漂移能一路合进 main。
# 这里把本地那条链原样搬进 CI —— 不新增检查项，只保证它真的会被跑。

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# 同一分支来了新推送时取消上一轮（省额度，结论也只关心最新）
concurrency:
  group: ci-${{ github.ref }}
  # PR 上新 push 掐掉旧 run（省资源）；**main 上不掐** —— 每次合并都要留下一份完整的检查，
  # 否则连合两条时，先合的那次 run 会被后一次 push 取消，merge commit 上显示 `cancelled`，
  # 看上去像合失败（2026-09-20 实际造成过一次困惑：部署 job 显示 cancelled，代码其实没事）。
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # ⚠️ 本 job 的 name 是分支保护的**必需状态检查**（repos/.../branches/main/protection）。
  # 改名 = 保护里那条检查永远等不到 → PR 卡死。要改必须同时更新保护配置。
  verify:
    name: 全链验证（verify-all 8 步）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: 安装依赖
        run: npm ci

      # 与本地**逐字同一条链**（脚本自己推仓库根，不依赖 cwd）：
      # typecheck → build → typecheck:types → typecheck:tests → build:cli → test → e2e → build:website
      # 脚本按每步的**显式退出码**判定，失败会打印该步尾部输出。
      - name: verify-all
        run: bash scripts/verify-all.sh

  # 静态检查单独一个 job：不跑测试、失败快、反馈早（几秒 vs 几分钟）
  lint:
    name: Lint + 格式（Biome）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: 安装依赖
        run: npm ci

      # `biome ci` 在 CI 下只报告、不写盘（--write 是本地用的）。
      # `--error-on-warnings`：零告警闸门（此前是「没 error 就绿」，存量 93 warnings 照样过）。
      - name: biome ci
        run: npx biome ci . --error-on-warnings

  # 守住 package.json 的 engines 声明（>=18）—— 见 scripts/check-import-floor.mjs 的说明。
  # 为什么不在 verify 里加矩阵：matrix 会给 job name 加后缀、进而改掉分支保护依赖的
  # 检查名（PR 会被卡死），所以这里用**独立 job**覆盖最低支持版本。
  import-floor:
    name: 导入下限（Node ${{ matrix.node }}）
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['18', '20']
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 构建
        run: npm run build

      - name: 验证包可导入 + SqliteTaskStore 行为
        run: node scripts/check-import-floor.mjs

  e2e-mcp:
    name: MCP 端到端（真第三方 server，缺失时回落夹具）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: 安装依赖
        run: npm ci

      # runner 上默认没有 uvx ⇒ 脚本的「离线回落本地夹具」分支**必定被走到**。
      # 一举两得：
      #   ① 确定性覆盖整条 MCP 协议面（夹具 server 与真 server 同一套协议，纯 stdlib，不联网）；
      #   ② 正好当「回落不许再崩」的回归守卫 —— 此前 spawn `uvx` 不存在时抛未捕获 'error'
      #      事件把进程带崩、根本走不到回落（已修：scripts/e2e-mcp.ts 的 proc.on('error')）。
      # 想覆盖真第三方 server（`uvx mcp-server-time`）在本机跑即可，
      # 或给本 job 加 astral-sh/setup-uv —— 但那样就不再覆盖回落分支了。
      - name: e2e:mcp
        run: npm run e2e:mcp

  # ── 发布：官网自动上线 ──────────────────────────────────────────────────────────
  # 为什么有这个 job：官网部署此前**纯手动**（`npm run deploy:website`，见根 package.json）。
  # 2026-09-13 实际翻车了一次：PR #16 合并进 main、CI 全绿、仓库「看起来完事了」，
  # 线上却还是旧版 —— 因为合并只跑检查，**不会**推 Cloudflare Pages。只要没人记得敲那条
  # 命令，改动就静静躺在仓库里。本 job 把「push 到 main → 上线」变成不可忘的动作。
  #
  # 为什么放在本文件、而不是另开 deploy.yml：**跨 workflow 用不了 `needs:`**。
  # 另开文件就只能靠 `workflow_run` 绕，且部署**无法等验证通过** —— 坏产物可能先上线。
  # 放同一文件才能 `needs: [verify, lint]`，保证线上永远是过了验证的那一版。
  #
  # ⚠️ 本 job **不是**必需状态检查，**不要**加进分支保护：它只在 main 上跑（PR 上 skip），
  #    加进去会让 PR 永远等一个不会跑的检查 → 卡死（同上面 `verify` 的坑）。
  #
  # 需要两个仓库 secret（Settings → Secrets and variables → Actions）：
  #   CLOUDFLARE_API_TOKEN   —— 权限：Account → Cloudflare Pages → Edit
  #   CLOUDFLARE_ACCOUNT_ID  —— Cloudflare 账号 ID
  # 缺 secret 时本 job **响亮失败**并给出修复指引，不静默跳过 ——
  # 「静默跳过」正是上面那类「以为部署了、其实没有」的病根。
  deploy-website:
    name: 部署官网（Cloudflare Pages）
    runs-on: ubuntu-latest
    needs: [verify, lint] # 只在验证通过后才发布（verify 里已经建好 dist，这里复查一遍）
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: 安装依赖
        run: npm ci

      # 先亮出「secret 没配」这个具体故障，而不是让 wrangler 抛一句难懂的认证错
      - name: 检查 secret 是否已配置
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          missing=""
          if [ -z "$TOKEN" ]; then missing="$missing CLOUDFLARE_API_TOKEN"; fi
          if [ -z "$ACCOUNT" ]; then missing="$missing CLOUDFLARE_ACCOUNT_ID"; fi
          if [ -n "$missing" ]; then
            echo "::error::缺少仓库 secret:$missing —— 到 Settings → Secrets and variables → Actions 添加（CLOUDFLARE_API_TOKEN 需 Account → Cloudflare Pages → Edit 权限），然后重跑本 job。"
            exit 1
          fi

      # 与本地**逐字同一条命令**：`npm run deploy:website`
      # （= npm run build:website && npx --yes wrangler@4.131.0 pages deploy packages/website/dist --project-name=agentia-web）
      # CI 与人工共用同一条链、同一个 wrangler 版本 —— 不另立第二套参数（那正是漂移的起点）。
      - name: 构建并部署（与本地同一条命令）
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run deploy:website
