# 依赖更新自动化。本包**零运行时依赖**；devDependencies 里的 @anthropic-ai/sdk
# 只做类型兼容门禁（tests/types/message-compat.types.ts），它的 API 面变动会影响
# 默认 ModelClient 的类型对齐，值得跟着走。
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'chore(deps)'
    groups:
      # 把开发依赖合成一个 PR，避免每周被 10 个琐碎 PR 淹没
      dev-dependencies:
        dependency-type: development

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: 'chore(ci)'
