# 依赖更新自动化。本包运行时依赖极少（唯一硬依赖是 @anthropic-ai/sdk），
# 但它的 API 面变动会直接影响默认 ModelClient，值得跟着走。
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'chore(deps)'
    groups:
      # 把开发依赖合成一个 PR，避免每周被 10 个琐碎 PR 淹没
      dev-dependencies:
        dependency-type: development

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: 'chore(ci)'
