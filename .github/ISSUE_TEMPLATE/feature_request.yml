name: 功能建议
description: 想要框架支持的新能力或新用法
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: 你遇到的问题
      description: 先讲**场景与痛点**，再讲想要的方案 —— 方案常有多种，痛点只有一个
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 你设想的方案
      description: 若涉及 API，写下你期望的调用形态

  - type: textarea
    id: alternatives
    attributes:
      label: 试过的替代方案
      description: 例如：能否已用 `@Tool` / 中间件 / sink 缝自己解决？为什么不够？

  - type: markdown
    attributes:
      value: |
        > 请先对照框架的**边界**：只给缝、不给策略；零新增运行时依赖（可选能力走 duck-typed / peer）；
        > 不做部署 / 凭据 / 进程级决策。详见 [`docs/roadmap.md`](https://github.com/retrychx/agentia/blob/main/docs/roadmap.md)
        > 与 [`docs/spec.md`](https://github.com/retrychx/agentia/blob/main/docs/spec.md)。
