# Agentia 部署示例 —— compose 编排。
# 用法：export ANTHROPIC_API_KEY=sk-ant-... && docker compose up --build
#      （或把变量写进同目录 .env，compose 会自动读取；.env 已 gitignore）

services:
  agent:
    build: .
    image: agentia-deploy-example
    environment:
      # 缺省就报错退出，避免「起来了但没模型凭据」的静默失败
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:?请先 export ANTHROPIC_API_KEY（或写进 .env）}
      # 可选：兼容端点 / 换模型
      ANTHROPIC_BASE_URL: ${ANTHROPIC_BASE_URL:-}
      AGENTIA_MODEL: ${AGENTIA_MODEL:-claude-opus-5}
      AGENTIA_DB: /data/agentia.db
    ports:
      - '3000:3000'
    volumes:
      - agentia-data:/data
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    # 必须 > handler.drain({ timeoutMs: 15_000 })：容器停之前留够优雅停机时间
    stop_grace_period: 25s
    restart: unless-stopped

volumes:
  agentia-data:
