# Agentia 完整示例 —— compose 编排。
# 用法（在该文件所在目录）：export ANTHROPIC_API_KEY=sk-ant-... && docker compose up --build
# （或写进同目录 .env，compose 会自动读取；.env 已 gitignore）

services:
  agent:
    build:
      # 构建上下文是**仓库根** —— 框架未发布，镜像里先从源码构建（见 Dockerfile 头部说明）
      context: ../..
      dockerfile: examples/complete/Dockerfile
    image: agentia-complete-example
    environment:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:?请先 export ANTHROPIC_API_KEY（或写进 .env）}
      ANTHROPIC_BASE_URL: ${ANTHROPIC_BASE_URL:-}
      AGENTIA_MODEL: ${AGENTIA_MODEL:-claude-opus-5}
      AGENTIA_DB: /data/agentia.db
      # 观测：生产建议开采样（错误 run 仍全留）
      AGENTIA_SAMPLE_RATE: ${AGENTIA_SAMPLE_RATE:-0.1}
      # 定时任务（毫秒）；0 = 关闭
      AGENTIA_CHECK_INTERVAL_MS: ${AGENTIA_CHECK_INTERVAL_MS:-0}
      # 设了就要求 x-api-key 头；留空 = 不鉴权
      API_KEY: ${API_KEY:-}
    ports:
      - '3000:3000'
    volumes:
      - agentia-data:/data
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
    # 必须 > handler.drain({ timeoutMs: 15_000 })
    stop_grace_period: 25s
    restart: unless-stopped

volumes:
  agentia-data:
