<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- 深色圆角底：避免浅色图形在浅色标签栏上"消失" -->
  <rect width="32" height="32" rx="7" fill="#0b0b0d"/>
  <rect x="0.5" y="0.5" width="31" height="31" rx="6.5" fill="none" stroke="#33394a" stroke-width="1"/>
  <!-- 品牌同款「主 agent + 三单元」编排图形，放大 1.18 并居中（16px 下仍可辨） -->
  <g transform="translate(16 16) scale(1.18) translate(-16 -14.1)">
    <circle cx="16" cy="16" r="3.4" fill="#d9e2ee"/>
    <circle cx="16" cy="7.6" r="1.8" fill="#d9e2ee" opacity=".85"/>
    <circle cx="23.4" cy="20.6" r="1.8" fill="#d9e2ee" opacity=".85"/>
    <circle cx="8.6" cy="20.6" r="1.8" fill="#d9e2ee" opacity=".85"/>
  </g>
</svg>
